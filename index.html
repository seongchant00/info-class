<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 수업 활동</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
  :root { --bg:#F1F3F6; --card:#fff; --ink:#151B24; --muted:#566273; --line:#D0D7E1; --blue:#2C4C8E; --orange:#B8471E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F131A; --card:#171D26; --ink:#E3E8EF; --muted:#97A3B4; --line:#2C3645; --blue:#93ADEA; --orange:#F08A5D; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:48px 16px; display:flex; flex-direction:column; gap:20px; }
  h1 { font-family:"Black Han Sans",sans-serif; font-weight:400; font-size:clamp(30px,6vw,42px); margin:0; }
  p { margin:0; color:var(--muted); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:14px; }
  a.card { display:flex; flex-direction:column; gap:6px; padding:20px; background:var(--card); border:1px solid var(--line); border-radius:14px; text-decoration:none; color:inherit; }
  a.card:hover { border-color:var(--muted); }
  a.card b { font-family:"Black Han Sans",sans-serif; font-weight:400; font-size:24px; }
  a.card.pixel b { color:var(--blue); } a.card.sound b { color:var(--orange); }
  a.card span { font-size:14px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>정보 수업 활동</h1>
  <p>2.1.2 다양한 데이터의 디지털 표현</p>
  <div class="grid">
    <a class="card pixel" href="pixel.html"><b>그림 암호 작전</b><span>이미지 · 픽셀 · 해상도</span></a>
    <a class="card sound" href="sound.html"><b>소리 암호 작전</b><span>소리 · 표본화 · 양자화</span></a>
  </div>
</main>
</body>
</html>
